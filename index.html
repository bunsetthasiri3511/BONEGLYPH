<div id="ov"><h1>NECROMANCER · FIRST PERSON</h1><p id="ovt">ปลุกพลังความตายแล้วสู้กับคลื่นศัตรูไม่หยุด<br>WASD เดิน · เมาส์เล็ง · คลิกซ้าย/ค้าง = Soul Bolt · 1-6 = สกิล<br>มือถือ: ลากฝั่งซ้ายเดิน ลากฝั่งขวาเล็ง กดปุ่มสกิล</p><button id="go">เริ่มเกม</button></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const T=THREE,$=s=>document.querySelector(s),cv=$('#c'),ctx=cv.getContext('2d');
const R=new T.WebGLRenderer({antialias:false});R.setPixelRatio(1);const gl=R.getContext();
const sc=new T.Scene(),cam=new T.PerspectiveCamera(78,1,.1,120);cam.rotation.order='YXZ';
sc.background=new T.Color(0x07060b);sc.fog=new T.FogExp2(0x0b0710,.026);sc.add(cam);
let cols,rows,cw,ch,buf;
function resize(){const W=innerWidth,H=innerHeight;cw=W<700?6:7;ch=cw*1.7;cv.width=W;cv.height=H;cols=Math.floor(W/cw);rows=Math.floor(H/ch);R.setSize(cols,rows,false);cam.aspect=W/H;cam.updateProjectionMatrix();buf=new Uint8Array(cols*rows*4)}
addEventListener('resize',resize);resize();
const L=(c,r=.9)=>new T.MeshLambertMaterial({color:c}),B=(c,o=1)=>new T.MeshBasicMaterial({color:c,transparent:o<1,opacity:o,blending:o<1?T.AdditiveBlending:T.NormalBlending,depthWrite:o>=1});
// ---------- world ----------
sc.add(new T.HemisphereLight(0xb8a8d8,0x241a2c,1.25));
const plight=new T.PointLight(0xd0a0ff,1.1,16);cam.add(plight);
const floor=new T.Mesh(new T.CircleGeometry(34,48),L(0x3a3444));floor.rotation.x=-Math.PI/2;sc.add(floor);
const wall=new T.Mesh(new T.CylinderGeometry(34,34,9,40,1,true),new T.MeshLambertMaterial({color:0x2a2233,side:T.BackSide}));wall.position.y=4;sc.add(wall);
for(const r of [5,10,16]){const t=new T.Mesh(new T.TorusGeometry(r,.12,4,64),B(0xa02838));t.rotation.x=Math.PI/2;t.position.y=.03;sc.add(t)}
const pillars=[];
function pillar(x,z,h,r){const m=new T.Mesh(new T.CylinderGeometry(r,r*1.15,h,8),L(0x6a5d72));m.position.set(x,h/2,z);sc.add(m);pillars.push({x,z,r:r+.2})}
for(let i=0;i<20;i++){const a=i/20*6.283;pillar(Math.cos(a)*30,Math.sin(a)*30,7,1)}
for(let i=0;i<8;i++){const a=i*2.4+.6,d=11+(i%3)*4;pillar(Math.cos(a)*d,Math.sin(a)*d,3.2,.8)}
const torches=[];for(let i=0;i<8;i++){const a=i/8*6.283+.2,x=Math.cos(a)*23,z=Math.sin(a)*23;const b=new T.Mesh(new T.CylinderGeometry(.25,.35,1.2,6),L(0x5a4a60));b.position.set(x,.6,z);sc.add(b);const f=new T.Mesh(new T.IcosahedronGeometry(.35,0),B(0xffa040));f.position.set(x,1.5,z);sc.add(f);const l=new T.PointLight(0xff8a40,1.3,14);l.position.set(x,2,z);sc.add(l);torches.push({f,l,p:i})}
const lp=[0,1,2,3].map(()=>{const l=new T.PointLight(0xffffff,0,22);sc.add(l);return l});let li=0;
// ---------- player + staff ----------
const P={pos:new T.Vector3(0,1.7,0),yaw:0,pitch:0,hp:100,mana:100,score:0};
const staff=new T.Group();cam.add(staff);staff.position.set(.5,-.5,-.9);staff.rotation.set(.3,0,-.15);
const wood=new T.Mesh(new T.CylinderGeometry(.03,.04,1.8,7),L(0x4a352a));staff.add(wood);
const sk=new T.Mesh(new T.SphereGeometry(.13,10,8),L(0xe0d4b8));sk.position.y=.95;staff.add(sk);
for(const s of [-1,1]){const e=new T.Mesh(new T.SphereGeometry(.03,6,5),B(0xff3a2a));e.position.set(s*.05,.97,-.1);staff.add(e)}
const orb=new T.Mesh(new T.SphereGeometry(.09,8,6),B(0xc060ff));orb.position.y=1.25;staff.add(orb);
const hand=new T.Mesh(new T.SphereGeometry(.09,8,6),B(0xff5a4a,.9));hand.position.set(-.4,-.4,-.7);cam.add(hand);
let recoil=0,shake=0;
// ---------- particles / fx ----------
const parts=[],pg=new T.OctahedronGeometry(1,0);
for(let i=0;i<350;i++){const m=new T.Mesh(pg,B(0xffffff,.9));m.visible=false;sc.add(m);parts.push({m,v:new T.Vector3(),life:0,max:1,g:0,s:.1})}
let pi_=0;function burst(p,col,n,sp,life,size,g=0,up=0){for(let i=0;i<n;i++){const q=parts[pi_++%parts.length];q.m.visible=true;q.m.material.color.setHex(col);q.m.position.copy(p);q.v.set((Math.random()-.5)*sp,Math.random()*sp*.6+up,(Math.random()-.5)*sp);q.life=q.max=life*(.6+Math.random()*.6);q.g=g;q.s=size*(.5+Math.random())}}
const fxs=[];function addFx(o,dur,upd,end){sc.add(o);fxs.push({o,dur,a:0,upd,end})}
const timers=[];const later=(t,f)=>timers.push({t,f});
function flash(c,I,p,d=.5){const l=lp[li++%4];l.color.setHex(c);l.position.copy(p);addFx(new T.Object3D(),d,q=>{l.intensity=I*Math.pow(1-q,2)})}
const fl=$('#fl');function screen(c,a){fl.style.transition='none';fl.style.background=c;fl.style.opacity=a;requestAnimationFrame(()=>{fl.style.transition='opacity .4s';fl.style.opacity=0})}
function ring(p,col,R_,dur,th=.12){const r=new T.Mesh(new T.TorusGeometry(1,th,6,48),B(col,.9));r.rotation.x=Math.PI/2;r.position.copy(p);r.position.y=.2;addFx(r,dur,q=>{r.scale.setScalar(.3+q*R_);r.material.opacity=.9*(1-q)})}
// ---------- enemies ----------
const enemies=[];
function spawnEnemy(){const brute=wave>1&&Math.random()<Math.min(.35,wave*.05),a=Math.random()*6.283;
 const g=new T.Group(),mat=L(brute?0x7a4048:0x6c7a62);const bs=brute?1.7:1;
 const body=new T.Mesh(new T.CylinderGeometry(.35,.45,1.2,7),mat);body.position.y=.8;g.add(body);
 const head=new T.Mesh(new T.SphereGeometry(.25,8,6),L(0xcfc8b4));head.position.y=1.7;g.add(head);
 for(const s of [-1,1]){const e=new T.Mesh(new T.SphereGeometry(.05,5,4),B(0xff3a2a));e.position.set(s*.1,1.75,.2);g.add(e);const ar=new T.Mesh(new T.BoxGeometry(.12,.12,.8),mat);ar.position.set(s*.45,1.2,.35);g.add(ar)}
 g.scale.setScalar(bs);g.position.set(Math.cos(a)*27,0,Math.sin(a)*27);sc.add(g);
 enemies.push({g,mat,hp:brute?170+wave*15:35+wave*5,speed:brute?2.6:3.8+Math.random()*1.2,dmg:brute?18:8,r:.5*bs,vx:0,vz:0,hit:0,cd:0,ph:Math.random()*6,brute})}
function hurt(e,n,kx=0,kz=0){e.hp-=n;e.hit=.1;e.vx+=kx;e.vz+=kz;if(e.hp<=0)kill(e)}
function kill(e){const i=enemies.indexOf(e);if(i<0)return;enemies.splice(i,1);sc.remove(e.g);burst(e.g.position.clone().setY(1),0xd8d0b8,e.brute?22:10,6,.9,.09,12,3);P.score+=e.brute?50:10;P.mana=Math.min(100,P.mana+4);$('#sc').textContent=P.score}
function blast(x,z,r,dmg,kn=0){for(const e of enemies.slice()){const dx=e.g.position.x-x,dz=e.g.position.z-z,d=Math.hypot(dx,dz);if(d<r)hurt(e,dmg*(1-d/r*.5),dx/(d||1)*kn,dz/(d||1)*kn)}}
// ---------- aiming ----------
const dir=()=>{const d=new T.Vector3();cam.getWorldDirection(d);return d};
const handPos=()=>cam.localToWorld(new T.Vector3(.2,-.35,-1.2));
function aimGround(){const d=dir();if(d.y<-.04){const t=Math.min(-cam.position.y/d.y,40);return cam.position.clone().addScaledVector(d,t).setY(0)}return cam.position.clone().addScaledVector(d,20).setY(0)}
// ---------- skills ----------
const projs=[];
function soulBolt(){const o=handPos(),d=dir();const m=new T.Group();m.add(new T.Mesh(new T.IcosahedronGeometry(.22,1),B(0xff4a5a)),new T.Mesh(new T.SphereGeometry(.4,8,6),B(0xc040ff,.5)));m.position.copy(o);sc.add(m);projs.push({m,v:d.multiplyScalar(42),life:1.3,pierce:2,hit:new Set()});recoil=.6;flash(0xff4a6a,2.5,o,.15)}
function chain(){const o=handPos(),d=dir();let best=null,bs=-1;for(const e of enemies){const v=e.g.position.clone().setY(1.2).sub(cam.position),l=v.length(),dt=v.normalize().dot(d);if(l<38&&dt>.8&&dt-l*.004>bs){bs=dt-l*.004;best=e}}
 let cur=best,from=o,left=8,dm=70,seen=new Set();const pts=[o.clone()];
 if(!cur){const end=o.clone().addScaledVector(d,24);pts.push(end)}
 while(cur&&left--){seen.add(cur);const p=cur.g.position.clone().setY(1.2);for(let k=1;k<4;k++){pts.push(from.clone().lerp(p,k/4).add(new T.Vector3((Math.random()-.5)*.8,(Math.random()-.5)*.8,(Math.random()-.5)*.8)))}pts.push(p);hurt(cur,dm,0,0);burst(p,0x80e8ff,10,5,.4,.07);dm*=.85;from=p;let n=null,nd=10;for(const e of enemies){if(seen.has(e))continue;const q=e.g.position.distanceTo(cur.g.position);if(q<nd){nd=q;n=e}}cur=n}
 const mk=w=>new T.Line(new T.BufferGeometry().setFromPoints(pts),new T.LineBasicMaterial({color:w?0xffffff:0x40d8ff,transparent:true}));const a=mk(0),b=mk(1);const g=new T.Group();g.add(a,b);
 addFx(g,.3,q=>{a.material.opacity=b.material.opacity=1-q});flash(0x60e0ff,4,from,.3);screen('#40c8ff',.12);shake=Math.max(shake,.15);recoil=1}
function meteor(x,z,delay,big){later(delay,()=>{const g=new T.Group(),r=big?1.3:.5;g.add(new T.Mesh(new T.IcosahedronGeometry(r,1),B(0xffd080)),new T.Mesh(new T.IcosahedronGeometry(r*1.5,1),B(0xff5a20,.6)));const tail=new T.Mesh(new T.ConeGeometry(r*1.1,r*9,8,1,true),B(0xff7a30,.45));tail.position.y=r*5;g.add(tail);
 const s=new T.Vector3(x-9,30,z-7),e=new T.Vector3(x,r,z);g.quaternion.setFromUnitVectors(new T.Vector3(0,1,0),s.clone().sub(e).normalize());
 addFx(g,big?1.2:.7,q=>{g.position.lerpVectors(s,e,q*q)},()=>impact(x,z,big?9:4.2,big?220:90,big))});
 const mk=new T.Mesh(new T.RingGeometry((big?9:4.2)*.9,(big?9:4.2),32),B(0xff4a2a,.5));mk.rotation.x=-Math.PI/2;mk.position.set(x,.06,z);addFx(mk,delay+(big?1.2:.7),q=>{mk.material.opacity=.3+.4*Math.abs(Math.sin(q*20))})}
function impact(x,z,r,dmg,big){const p=new T.Vector3(x,.3,z);blast(x,z,r,dmg,big?14:7);burst(p,0xff7a30,big?60:20,big?16:9,1.1,big?.22:.12,14,big?9:5);burst(p,0xffd080,big?30:10,6,.7,.1,6,4);ring(p,0xffd27a,r,.6,.2);ring(p,0xff4a2a,r*1.3,.9,.1);
 const col=new T.Mesh(new T.CylinderGeometry(r*.12,r*.2,r*1.6,10,1,true),B(0xff8a3a,.6));col.position.set(x,r*.7,z);addFx(col,.7,q=>{col.scale.set(1+q,1+q*.5,1+q);col.material.opacity=.6*(1-q)});flash(0xff6a2a,big?14:7,p.clone().setY(2),.7);shake=Math.max(shake,big?1:.28);if(big)screen('#ff8a4a',.5)}
function meteorStorm(){const c=aimGround();screen('#ff5a30',.15);for(let i=0;i<12;i++){const a=i*2.4,rad=Math.sqrt(i/12)*6;meteor(c.x+Math.cos(a)*rad,c.z+Math.sin(a)*rad,.2+i*.14,false)}meteor(c.x,c.z,1.9,true)}
function nova(){const p=P.pos.clone().setY(.2);blast(p.x,p.z,10,65,22);P.hp=Math.min(100,P.hp+12);ring(p,0xff3a5a,10,.7,.2);ring(p,0xc040ff,12,.9,.1);ring(p,0xffffff,8,.5,.08);
 for(let i=0;i<14;i++){const a=i/14*6.283,c=new T.Mesh(new T.CylinderGeometry(.05,.2,3,6),B(i%2?0xff3a5a:0xc040ff,.7));c.position.set(p.x+Math.cos(a)*3,1.5,p.z+Math.sin(a)*3);addFx(c,.6,q=>{c.position.y=1.5+q*3;c.material.opacity=.7*(1-q);c.position.x=p.x+Math.cos(a)*(3+q*6);c.position.z=p.z+Math.sin(a)*(3+q*6)})}
 burst(p,0xff5a7a,40,14,.8,.12,0,2);flash(0xff3a5a,8,p.clone().setY(1.5),.6);screen('#ff3a5a',.3);shake=.5}
function deathRay(){const g=new T.Group(),core=new T.Mesh(new T.CylinderGeometry(.14,.14,1,8),B(0xffffff)),outer=new T.Mesh(new T.CylinderGeometry(.5,.5,1,10),B(0xff2a5a,.5));g.add(core,outer);let tick=0;
 addFx(g,1.3,(q,dt)=>{const o=handPos(),d=dir();g.position.copy(o).addScaledVector(d,20);g.quaternion.setFromUnitVectors(new T.Vector3(0,1,0),d);g.scale.set(1+Math.sin(q*60)*.15,40,1+Math.sin(q*60)*.15);core.material.opacity=1;outer.material.opacity=.5*(1-Math.max(0,q-.8)*5);
  tick-=dt;if(tick<=0){tick=.06;for(const e of enemies.slice()){const v=e.g.position.clone().setY(1).sub(o),t=v.dot(d);if(t>0&&v.addScaledVector(d,-t).length()<1.4+e.r){hurt(e,14,d.x*3,d.z*3);burst(e.g.position.clone().setY(1.2),0xff6a8a,3,5,.3,.08)}}}shake=Math.max(shake,.12);recoil=.5})}
function apocalypse(){screen('#ff3a20',.6);shake=1.4;nova();for(let i=0;i<26;i++){const a=i*2.4,rad=3+Math.sqrt(i/26)*22;meteor(P.pos.x+Math.cos(a)*rad,P.pos.z+Math.sin(a)*rad,.3+i*.1,i%7===0)}meteor(P.pos.x+dir().x*10,P.pos.z+dir().z*10,2.6,true)}
const SK=[{n:'SOUL BOLT',i:'✦',cd:.16,mp:2,f:soulBolt},{n:'LIGHTNING',i:'ϟ',cd:1.2,mp:16,f:chain},{n:'METEOR',i:'☄',cd:6,mp:30,f:meteorStorm},{n:'BLOOD NOVA',i:'✹',cd:5,mp:25,f:nova},{n:'DEATH RAY',i:'➶',cd:9,mp:35,f:deathRay},{n:'APOCALYPSE',i:'☠',cd:32,mp:70,f:apocalypse}];
const cd=SK.map(()=>0);
$('#skills').innerHTML=SK.map((s,i)=>`<button data-i="${i}"><b>${i+1}</b>${s.i}<small>${s.n}</small><u></u></button>`).join('');
const sb=[...document.querySelectorAll('#skills button')];
function cast(i){if(!playing||cd[i]>0||P.mana<SK[i].mp)return;P.mana-=SK[i].mp;cd[i]=SK[i].cd;SK[i].f()}
let firing=false;
sb.forEach((b,i)=>{b.addEventListener('pointerdown',e=>{e.preventDefault();if(i===0)firing=true;else cast(i)});b.addEventListener('pointerup',()=>{if(i===0)firing=false});b.addEventListener('pointerleave',()=>{if(i===0)firing=false})});
// ---------- input ----------
const keys={};let ix=0,iz=0,sId=null,lId=null,sOrg=null,lLast=null,locked=false;
addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=1;if(e.key>='1'&&e.key<='6')cast(+e.key-1)});addEventListener('keyup',e=>keys[e.key.toLowerCase()]=0);
document.addEventListener('pointerlockchange',()=>locked=document.pointerLockElement===cv);
document.addEventListener('mousemove',e=>{if(locked){P.yaw-=e.movementX*.0023;P.pitch=Math.max(-1.3,Math.min(1.3,P.pitch-e.movementY*.0023))}});
cv.addEventListener('pointerdown',e=>{if(e.pointerType==='mouse'){if(!locked)cv.requestPointerLock();else if(e.button===0)firing=true;return}
 cv.setPointerCapture(e.pointerId);if(e.clientX<innerWidth*.4&&sId===null){sId=e.pointerId;sOrg={x:e.clientX,y:e.clientY};const s=$('#stick');s.style.display='block';s.style.left=e.clientX-45+'px';s.style.top=e.clientY-45+'px'}else if(lId===null){lId=e.pointerId;lLast={x:e.clientX,y:e.clientY}}});
cv.addEventListener('pointermove',e=>{if(e.pointerId===sId){ix=Math.max(-1,Math.min(1,(e.clientX-sOrg.x)/45));iz=Math.max(-1,Math.min(1,-(e.clientY-sOrg.y)/45))}else if(e.pointerId===lId){P.yaw-=(e.clientX-lLast.x)*.006;P.pitch=Math.max(-1.3,Math.min(1.3,P.pitch-(e.clientY-lLast.y)*.006));lLast={x:e.clientX,y:e.clientY}}});
const up=e=>{if(e.pointerType==='mouse'){firing=false;return}if(e.pointerId===sId){sId=null;ix=iz=0;$('#stick').style.display='none'}if(e.pointerId===lId)lId=null};
cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',up);document.addEventListener('contextmenu',e=>e.preventDefault());
// ---------- game flow ----------
let playing=false,wave=0,toSpawn=0,spawnT=0,nextWave=0,over=false;
function banner(t){const b=$('#banner');b.textContent=t;b.style.opacity=1;setTimeout(()=>b.style.opacity=0,1800)}
function startWave(){wave++;toSpawn=5+wave*3;$('#wv').textContent=wave;banner('WAVE '+wave)}
function reset(){enemies.splice(0).forEach(e=>sc.remove(e.g));projs.splice(0).forEach(p=>sc.remove(p.m));P.hp=100;P.mana=100;P.score=0;P.pos.set(0,1.7,0);wave=0;cd.fill(0);$('#sc').textContent=0;over=false;nextWave=.5}
$('#go').onclick=()=>{reset();playing=true;$('#ov').style.display='none';if(matchMedia('(pointer:fine)').matches)cv.requestPointerLock()};
function die(){over=true;playing=false;firing=false;document.exitPointerLock&&document.exitPointerLock();$('#ov').style.display='flex';$('#ov h1').textContent='YOU DIED';$('#ovt').innerHTML='ถึงคลื่นที่ '+wave+' · คะแนน '+P.score;$('#go').textContent='สู้อีกครั้ง'}
// ---------- ASCII renderer ----------
const RAMP=' .:-=+*#%@',MG='*x+X#@&%';let frame=0;
function ascii(){R.render(sc,cam);gl.readPixels(0,0,cols,rows,gl.RGBA,gl.UNSIGNED_BYTE,buf);
 ctx.fillStyle='#07060b';ctx.fillRect(0,0,cv.width,cv.height);ctx.font=`bold ${ch*1.05}px monospace`;ctx.textAlign='center';ctx.textBaseline='middle';
 for(let y=0;y<rows;y++){const row=(rows-1-y)*cols;for(let x=0;x<cols;x++){const i=(row+x)*4;let r=buf[i],g=buf[i+1],b=buf[i+2];let l=(r*.2126+g*.7152+b*.0722)/255;l=Math.min(1,Math.pow(l,.62)*1.25);const k=Math.floor(l*9.99);if(k<1)continue;
  const mx=Math.max(r,g,b),mn=Math.min(r,g,b);let c=RAMP[k];if(l>.55&&mx-mn>.45*mx)c=MG[((x*7+y*13+frame*5)>>0)%8];
  const m=1.45;ctx.fillStyle=`rgb(${Math.min(255,r*m)|0},${Math.min(255,g*m)|0},${Math.min(255,b*m)|0})`;ctx.fillText(c,x*cw+cw/2,y*ch+ch/2)}}frame++}
// ---------- main loop ----------
const clock=new T.Clock(),tmp=new T.Vector3();
function loop(){requestAnimationFrame(loop);const dt=Math.min(.05,clock.getDelta()),t=clock.elapsedTime;
 torches.forEach(q=>{const f=.8+.2*Math.sin(t*9+q.p*2)+.1*Math.sin(t*17+q.p);q.l.intensity=1.3*f;q.f.scale.setScalar(.8+.3*f)});
 if(playing){
  let mx=ix+(keys.d?1:0)-(keys.a?1:0),mz=iz+(keys.w?1:0)-(keys.s?1:0);const mg=Math.hypot(mx,mz);if(mg>1){mx/=mg;mz/=mg}
  const s=Math.sin(P.yaw),c=Math.cos(P.yaw);P.pos.x+=(mx*c-mz*s)*7*dt;P.pos.z+=(-mx*s-mz*c)*7*dt;
  for(const p of pillars){const dx=P.pos.x-p.x,dz=P.pos.z-p.z,d=Math.hypot(dx,dz),m=p.r+.4;if(d<m){P.pos.x=p.x+dx/d*m;P.pos.z=p.z+dz/d*m}}
  const rr=Math.hypot(P.pos.x,P.pos.z);if(rr>31){P.pos.x*=31/rr;P.pos.z*=31/rr}
  P.mana=Math.min(100,P.mana+9*dt);if(firing)cast(0);
  if(toSpawn>0){spawnT-=dt;if(spawnT<=0&&enemies.length<22){spawnEnemy();toSpawn--;spawnT=.55}}
  else if(!enemies.length&&nextWave<=0){nextWave=3}
  if(nextWave>0){nextWave-=dt;if(nextWave<=0)startWave()}
  for(const e of enemies){const g=e.g,dx=P.pos.x-g.position.x,dz=P.pos.z-g.position.z,d=Math.hypot(dx,dz)||1;
   e.vx*=1-Math.min(1,dt*6);e.vz*=1-Math.min(1,dt*6);
   if(d>1.2){g.position.x+=dx/d*e.speed*dt;g.position.z+=dz/d*e.speed*dt}else{e.cd-=dt;if(e.cd<=0){e.cd=.9;P.hp-=e.dmg;screen('#ff1030',.35);shake=Math.max(shake,.2)}}
   g.position.x+=e.vx*dt;g.position.z+=e.vz*dt;g.rotation.y=Math.atan2(dx,dz);g.position.y=Math.abs(Math.sin(t*8+e.ph))*.12;
   for(const o of enemies){if(o===e)continue;const ax=g.position.x-o.g.position.x,az=g.position.z-o.g.position.z,ad=Math.hypot(ax,az);if(ad<.9&&ad>0){g.position.x+=ax/ad*dt*2;g.position.z+=az/ad*dt*2}}
   for(const p of pillars){const ax=g.position.x-p.x,az=g.position.z-p.z,ad=Math.hypot(ax,az);if(ad<p.r+.5){g.position.x=p.x+ax/ad*(p.r+.5);g.position.z=p.z+az/ad*(p.r+.5)}}
   if(e.hit>0){e.hit-=dt;e.mat.emissive.setHex(0xffffff)}else e.mat.emissive.setHex(0)}
  if(P.hp<=0)die()}
 for(let i=0;i<cd.length;i++){if(cd[i]>0)cd[i]-=dt;sb[i].querySelector('u').style.height=(cd[i]>0?Math.min(100,cd[i]/SK[i].cd*100):P.mana<SK[i].mp?100:0)+'%'}
 for(let i=projs.length-1;i>=0;i--){const p=projs[i];p.m.position.addScaledVector(p.v,dt);p.m.rotation.y+=.3;p.life-=dt;if(Math.random()<.7)burst(p.m.position,0xc040ff,1,1,.35,.09);
  for(const e of enemies.slice()){if(p.hit.has(e))continue;const q=e.g.position;if(Math.hypot(q.x-p.m.position.x,q.z-p.m.position.z)<e.r+.5&&p.m.position.y<2.4){p.hit.add(e);hurt(e,28,p.v.x*.15,p.v.z*.15);burst(p.m.position,0xff4a5a,8,6,.4,.1);if(--p.pierce<0)p.life=0}}
  if(p.life<=0||Math.hypot(p.m.position.x,p.m.position.z)>33){sc.remove(p.m);projs.splice(i,1)}}
 for(let i=timers.length-1;i>=0;i--){timers[i].t-=dt;if(timers[i].t<=0){timers[i].f();timers.splice(i,1)}}
 for(let i=fxs.length-1;i>=0;i--){const f=fxs[i];f.a+=dt;const q=Math.min(1,f.a/f.dur);f.upd&&f.upd(q,dt);if(q>=1){sc.remove(f.o);f.end&&f.end();fxs.splice(i,1)}}
 for(const q of parts){if(q.life<=0)continue;q.life-=dt;if(q.life<=0){q.m.visible=false;continue}q.v.y-=q.g*dt;q.m.position.addScaledVector(q.v,dt);if(q.m.position.y<.05){q.m.position.y=.05;q.v.y*=-.3}q.m.scale.setScalar(q.s*(q.life/q.max))}
 recoil*=.85;shake*=.88;staff.position.set(.5,-.5+Math.sin(t*2)*.01-recoil*.05,-.9+recoil*.15);staff.rotation.x=.3+recoil*.3;orb.scale.setScalar(1+Math.sin(t*5)*.2+recoil);
 cam.position.set(P.pos.x+(Math.random()-.5)*shake*.4,1.7+Math.abs(Math.sin(t*9))*(keys.w||keys.s||keys.a||keys.d||iz||ix?.06:0)+(Math.random()-.5)*shake*.4,P.pos.z);cam.rotation.set(P.pitch,P.yaw,0);
 $('#hp').style.width=Math.max(0,P.hp)+'%';$('#mp').style.width=P.mana+'%';
 ascii()}
loop();
