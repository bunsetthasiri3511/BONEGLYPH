function ascii(){R.render(sc,cam);gl.readPixels(0,0,cols,rows,gl.RGBA,gl.UNSIGNED_BYTE,buf);
 ctx.fillStyle='#07060b';ctx.fillRect(0,0,cv.width,cv.height);ctx.font=`bold ${ch*1.05}px monospace`;ctx.textAlign='center';ctx.textBaseline='middle';
 for(let y=0;y<rows;y++){const row=(rows-1-y)*cols;for(let x=0;x<cols;x++){const i=(row+x)*4,r=buf[i],g=buf[i+1],b=buf[i+2];let l=(r*.2126+g*.7152+b*.0722)/255;l=Math.min(1,Math.pow(l,.62)*1.25);const k=Math.floor(l*9.99);if(k<1)continue;
  const mx=Math.max(r,g,b),mn=Math.min(r,g,b);let c=RAMP[k];if(l>.55&&mx-mn>.45*mx)c=MG[(x*7+y*13+frame*5)%8];
  ctx.fillStyle=`rgb(${Math.min(255,r*1.45)|0},${Math.min(255,g*1.45)|0},${Math.min(255,b*1.45)|0})`;ctx.fillText(c,x*cw+cw/2,y*ch+ch/2)}}frame++}

 torches.forEach(q=>{const f=.8+.2*Math.sin(t*9+q.p*2)+.1*Math.sin(t*17+q.p);q.l.intensity=1.4*f;q.f.scale.setScalar(.8+.3*f)});
 for(let i=timers.length-1;i>=0;i--){timers[i].t-=dt;if(timers[i].t<=0){const f=timers[i].f;timers.splice(i,1);f()}}
 for(let i=fxs.length-1;i>=0;i--){const f=fxs[i];f.a+=dt;const q=Math.min(1,f.a/f.dur);f.upd&&f.upd(q,dt);if(q>=1){sc.remove(f.o);f.end&&f.end();fxs.splice(i,1)}}
 for(const q of parts){if(q.life<=0)continue;q.life-=dt;if(q.life<=0){q.m.visible=false;continue}q.v.y-=q.g*dt;q.m.position.addScaledVector(q.v,dt);if(q.m.position.y<.05){q.m.position.y=.05;q.v.y*=-.3}q.m.scale.setScalar(q.s*(q.life/q.max))}
 castT*=.93;cg.position.y=Math.sin(t*1.8)*.05;staff.rotation.z=-.1-castT*.5;orb.scale.setScalar(1+Math.sin(t*5)*.2+castT*1.5);
 ret.position.set(aim.x,.3,aim.z);ret.rotation.y=t*1.5;ret.scale.setScalar(1+Math.sin(t*4)*.08);

 ascii()}
